version: '3'

vars:
    ENV: dev

tasks:
    default:
        desc: Show available tasks
        cmds:
            - task --list

    install:
        desc: Install PHP and admin dependencies
        cmds:
            - composer install
            -   task: admin:install

    composer:
        desc: Run Composer (task composer -- validate)
        cmds:
            - composer {{.CLI_ARGS}}

    serve:
        desc: Start the local PHP web server at 127.0.0.1:8000
        cmds:
            - composer serve

    docker:up:
        desc: Start MySQL and Mailpit in the background
        cmds:
            - docker compose up -d {{.CLI_ARGS}}

    docker:down:
        desc: Stop Docker services (preserves the database volume)
        cmds:
            - docker compose down {{.CLI_ARGS}}

    docker:logs:
        desc: Follow Docker logs (task docker:logs -- database)
        cmds:
            - docker compose logs --follow {{.CLI_ARGS}}

    docker:status:
        desc: Show Docker services and assigned ports
        cmds:
            - docker compose ps

    console:
        desc: Run the admin console (task console -- debug:router)
        cmds:
            - php bin/adminconsole --env={{.ENV}} {{.CLI_ARGS}}

    console:website:
        desc: Run the website console (task console:website -- debug:router)
        cmds:
            - php bin/websiteconsole --env={{.ENV}} {{.CLI_ARGS}}

    sulu:build:
        desc: Initialize Sulu with the dev build target (task sulu:build ENV=prod -- prod)
        interactive: true
        cmds:
            - php bin/adminconsole sulu:build --env={{.ENV}} {{.CLI_ARGS | default "dev"}}

    sulu:user:create:
        desc: Create a Sulu user interactively
        interactive: true
        cmds:
            - php bin/adminconsole sulu:security:user:create --env={{.ENV}} {{.CLI_ARGS}}

    db:create:
        desc: Create the database if it does not exist
        cmds:
            - php bin/adminconsole doctrine:database:create --if-not-exists --env={{.ENV}}

    db:migrate:
        desc: Run pending database migrations (interactive)
        interactive: true
        cmds:
            - php bin/adminconsole doctrine:migrations:migrate --env={{.ENV}} {{.CLI_ARGS}}

    db:diff:
        desc: Generate a migration from differences between the mapping and database
        cmds:
            - php bin/adminconsole doctrine:migrations:diff --env={{.ENV}} {{.CLI_ARGS}}

    cache:clear:
        desc: Clear the admin and website caches (task cache:clear ENV=prod)
        cmds:
            - php bin/adminconsole cache:clear --env={{.ENV}}
            - php bin/websiteconsole cache:clear --env={{.ENV}}

    cache:warmup:
        desc: Warm up the admin and website caches
        cmds:
            - php bin/adminconsole cache:warmup --env={{.ENV}}
            - php bin/websiteconsole cache:warmup --env={{.ENV}}

    assets:install:
        desc: Install bundle assets into public and initialize media directories
        cmds:
            - php bin/adminconsole assets:install public --env={{.ENV}}
            - php bin/adminconsole sulu:media:init --env={{.ENV}}

    admin:install:
        desc: Install admin dependencies (requires composer install first)
        dir: assets/admin
        cmds:
            - npm install {{.CLI_ARGS}}

    admin:build:
        desc: Build admin assets with Rsbuild for production
        dir: assets/admin
        cmds:
            - npm run build -- {{.CLI_ARGS}}

    admin:watch:
        desc: Rebuild admin assets with Rsbuild when files change
        dir: assets/admin
        cmds:
            - npm run watch -- {{.CLI_ARGS}}

    admin:update:
        desc: Update admin dependencies and build with Rsbuild
        dir: assets/admin
        cmds:
            - npm update {{.CLI_ARGS}}
            - npm run build

    search:reindex:
        desc: Rebuild search indexes with SEAL
        cmds:
            - php bin/adminconsole cmsig:seal:reindex --env={{.ENV}} {{.CLI_ARGS}}

    test:setup:
        desc: 'WARNING: Delete and recreate the test database'
        cmds:
            - composer bootstrap-test-environment

    test:
        desc: Run PHPUnit (task test -- --filter Name)
        cmds:
            - composer test -- {{.CLI_ARGS}}

    test:coverage:
        desc: Run PHPUnit with coverage reports in var/reports (requires Xdebug or PCOV)
        cmds:
            - composer test-with-coverage -- {{.CLI_ARGS}}

    lint:
        desc: Run all existing Composer quality checks
        cmds:
            - composer lint

    phpstan:
        desc: Run static PHP analysis with cache warmup
        cmds:
            - composer phpstan -- {{.CLI_ARGS}}

    fix:
        desc: Apply Rector and format PHP and Twig code
        cmds:
            - composer fix
